name: Budget Book
version: "1.2.5"
slug: budget_book
description: Original Budget Book interface and features, packaged as a Supervisor add-on.
url: https://github.com/Im-Tim-mI/Home-Assistant_Budget-Book
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
